<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday My Love 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pink: #f48fb1;
      --rose: #e91e8c;
      --gold: #d4af7a;
      --light: #fff0f6;
      --deep: #8b1a5c;
    }

    body {
      min-height: 100vh;
      background: #1a0010;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* ── Background ── */
    .bg {
      position: fixed; inset: 0;
      background-image: url('assets/bg.png');
      background-size: cover;
      background-position: center;
      filter: brightness(0.55) saturate(1.2);
      z-index: 0;
      transform: scale(1.05);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { transform: scale(1.05); filter: brightness(0.55) saturate(1.2); }
      to   { transform: scale(1.08); filter: brightness(0.60) saturate(1.35); }
    }

    /* ── Floating petals / hearts ── */
    .particle { position: fixed; pointer-events: none; z-index: 1; animation: floatUp linear infinite; opacity: 0; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
    }

    /* ── Sparkling stars ── */
    .star { position: fixed; pointer-events: none; z-index: 1; animation: twinkle ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ── Page wrapper ── */
    .scene { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 28px; }

    /* ── Top text ── */
    .top-text {
      text-align: center;
      animation: fadeDown 1.2s ease forwards;
      opacity: 0;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .top-text h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.8rem, 6vw, 5rem);
      color: #fff;
      text-shadow: 0 0 30px rgba(244,143,177,0.9), 0 0 60px rgba(244,143,177,0.5);
      letter-spacing: 2px;
      line-height: 1.1;
    }
    .top-text p {
      font-size: 1rem;
      color: rgba(255,220,235,0.85);
      margin-top: 6px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ── Polaroid Card ── */
    .polaroid-wrap {
      animation: fadeUp 1.4s ease 0.4s forwards;
      opacity: 0;
      perspective: 1000px;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .polaroid {
      width: clamp(260px, 35vw, 380px);
      background: #fff8fa;
      border-radius: 6px;
      box-shadow:
        0 30px 80px rgba(233,30,140,0.35),
        0 10px 30px rgba(0,0,0,0.4),
        0 0 0 1px rgba(212,175,122,0.3);
      padding: 22px 22px 50px;
      cursor: pointer;
      transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), box-shadow 0.4s ease;
      transform-style: preserve-3d;
      position: relative;
      transform: rotate(-2deg);
      user-select: none;
    }
    .polaroid:hover {
      transform: rotate(0deg) translateY(-12px) scale(1.04);
      box-shadow:
        0 50px 100px rgba(233,30,140,0.5),
        0 15px 40px rgba(0,0,0,0.5),
        0 0 0 1px rgba(212,175,122,0.6);
    }
    .polaroid:hover .click-hint { opacity: 1; transform: translateY(0); }

    /* Inner photo area */
    .polaroid-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 50%, #fce4ec 100%);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .polaroid-photo::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.6) 0%, transparent 60%);
    }
    .heart-icon {
      font-size: 5rem;
      animation: heartbeat 1.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(233,30,140,0.7));
      position: relative; z-index: 1;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.25); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.15); }
      70%  { transform: scale(1); }
    }

    /* roses in corners */
    .rose-corner { position: absolute; font-size: 1.8rem; animation: sway 3s ease-in-out infinite alternate; }
    .rose-corner.tl { top: 8px; left: 10px; animation-delay: 0s; }
    .rose-corner.tr { top: 8px; right: 10px; animation-delay: 0.5s; }
    .rose-corner.bl { bottom: 8px; left: 10px; animation-delay: 1s; }
    .rose-corner.br { bottom: 8px; right: 10px; animation-delay: 1.5s; }
    @keyframes sway {
      from { transform: rotate(-8deg) scale(0.95); }
      to   { transform: rotate(8deg) scale(1.05); }
    }

    /* Polaroid caption */
    .polaroid-caption {
      text-align: center;
      margin-top: 12px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.6rem;
      color: #c2185b;
      letter-spacing: 1px;
    }

    /* Gold tape strip */
    .tape {
      position: absolute;
      top: -16px; left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      width: 70px; height: 30px;
      background: rgba(212,175,122,0.65);
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .tape::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg, rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 4px, transparent 4px, transparent 8px
      );
      border-radius: inherit;
    }

    /* Wax seal */
    .wax-seal {
      position: absolute;
      bottom: 14px; right: 18px;
      width: 42px; height: 42px;
      background: radial-gradient(circle at 38% 38%, #e91e8c, #8b1a5c);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 3px 12px rgba(233,30,140,0.6), inset 0 -2px 4px rgba(0,0,0,0.3);
      animation: sealPulse 2.5s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 3px 12px rgba(233,30,140,0.6), inset 0 -2px 4px rgba(0,0,0,0.3); }
      50% { box-shadow: 0 3px 24px rgba(233,30,140,0.9), inset 0 -2px 4px rgba(0,0,0,0.3); }
    }

    /* Click hint */
    .click-hint {
      position: absolute;
      bottom: -44px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: linear-gradient(135deg, rgba(233,30,140,0.85), rgba(139,26,92,0.85));
      color: #fff;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(233,30,140,0.4);
      pointer-events: none;
    }
    .click-hint::before { content: '✉️ '; }

    /* ── Click ripple animation ── */
    .ripple-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .ripple {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff0f6, #e91e8c);
      animation: rippleExpand 0.9s ease forwards;
    }
    @keyframes rippleExpand {
      0%   { transform: scale(0); opacity: 1; }
      100% { transform: scale(200); opacity: 0; }
    }

    /* ── Page exit ── */
    body.exiting { animation: exitFade 0.9s ease forwards; }
    @keyframes exitFade {
      to { opacity: 0; transform: scale(1.06); }
    }

    /* ── Scroll hint bottom ── */
    .bottom-hint {
      font-size: 0.8rem;
      color: rgba(255,200,220,0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeUp 2s ease 1.8s forwards, floatBounce 2.5s ease-in-out 2.5s infinite;
      opacity: 0;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="ripple-overlay" id="rippleOverlay"></div>

  <!-- Particles injected by JS -->

  <div class="scene">
    <div class="top-text">
      <h1>Happy Birthday, My Love 💕</h1>
      <p>✨ A special surprise awaits you ✨</p>
    </div>

    <div class="polaroid-wrap">
      <div class="polaroid" id="card" onclick="openCard()">
        <div class="tape"></div>
        <div class="polaroid-photo">
          <span class="rose-corner tl">🌹</span>
          <span class="rose-corner tr">🌹</span>
          <span class="rose-corner bl">🌸</span>
          <span class="rose-corner br">🌸</span>
          <span class="heart-icon">💖</span>
        </div>
        <div class="polaroid-caption">For You, My Love</div>
        <div class="wax-seal">💌</div>
        <div class="click-hint">Open your letter</div>
      </div>
    </div>

    <div class="bottom-hint">✦ Click the card to open ✦</div>
  </div>

  <script>
    /* ── Copy asset images ── */

    /* ── Particles ── */
    const emojis = ['🌸','🌹','💕','✨','💫','🌷','💗','⭐'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        font-size: ${0.8 + Math.random() * 1.4}rem;
        animation-duration: ${6 + Math.random() * 10}s;
        animation-delay: ${-Math.random() * 12}s;
      `;
      document.body.appendChild(p);
    }

    /* ── Stars ── */
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = '✦';
      s.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: ${Math.random() * 100}vh;
        font-size: ${0.3 + Math.random() * 0.7}rem;
        color: rgba(255, 200, 230, ${0.4 + Math.random() * 0.6});
        animation-duration: ${2 + Math.random() * 4}s;
        animation-delay: ${-Math.random() * 4}s;
      `;
      document.body.appendChild(s);
    }

    /* ── Card tilt on mouse move ── */
    const card = document.getElementById('card');
    document.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const rx = ((e.clientY - cy) / cy) * -8;
      const ry = ((e.clientX - cx) / cx) * 8;
      card.style.transform = `rotate(-2deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'rotate(-2deg)';
    });

    /* ── Open card ── */
    function openCard() {
      const overlay = document.getElementById('rippleOverlay');
      overlay.innerHTML = '<div class="ripple"></div>';
      card.style.transform = 'rotate(-2deg) scale(0.96)';
      setTimeout(() => {
        document.body.classList.add('exiting');
      }, 300);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 950);
    }
  </script>
</body>
</html>
